<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Viewport meta tag for mobile responsiveness -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bloxd.io Window Switcher</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background-color: #121212;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      height: 100dvh; /* Dynamic viewport height for mobile browsers */
      margin: 0;
      padding: 10px;
      font-family: sans-serif;
      overflow: hidden;
    }

    /* Top navigation controls */
    .tab-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 8px;
      width: 100%;
      max-width: 1800px;
    }

    .tab-btn {
      padding: 10px 20px;
      background-color: #222;
      color: #aaa;
      border: 1px solid #444;
      border-radius: 6px 6px 0 0;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s, color 0.2s;
      flex-shrink: 0;
    }

    .tab-btn:hover {
      background-color: #333;
      color: #fff;
    }

    .tab-btn.active {
      background-color: #333;
      color: #00e5ff;
      border-bottom: 2px solid #00e5ff;
    }

    /* Responsive window dimensions */
    .game-container {
      width: 100%;
      max-width: 1800px;
      flex: 1; /* Automatically expands to fill remaining vertical screen space */
      border: 3px solid #333;
      border-radius: 0 8px 8px 8px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      position: relative;
    }

    /* Frame containers */
    .window-frame {
      width: 100%;
      height: 100%;
      display: none; /* Hidden by default */
    }

    .window-frame.active {
      display: block; /* Shown when active */
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Adjustments for smaller mobile screens */
    @media (max-width: 600px) {
      body {
        padding: 5px;
      }
      
      .tab-btn {
        padding: 8px 12px;
        font-size: 14px;
      }
      
      .game-container {
        border-radius: 0 0 6px 6px;
      }
    }
  </style>
</head>
<body>

  <!-- Navigation Buttons -->
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchWindow('win1', this)">Window 1</button>
    <button class="tab-btn" onclick="switchWindow('win2', this)">Window 2</button>
  </div>

  <!-- Game Container -->
  <div class="game-container">
    <div id="win1" class="window-frame active">
      <iframe 
        src="https://bloxd.io/" 
        allow="gamepad; autoplay; pointer-lock"
        sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-forms">
      </iframe>
    </div>

    <div id="win2" class="window-frame">
      <iframe 
        src="https://bloxd.io/" 
        allow="gamepad; autoplay; pointer-lock"
        sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-forms">
      </iframe>
    </div>
  </div>

  <script>
    function switchWindow(windowId, btnElement) {
      // Hide all windows
      document.querySelectorAll('.window-frame').forEach(frame => {
        frame.classList.remove('active');
      });

      // Deactivate all buttons
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active');
      });

      // Show selected window and set active button
      document.getElementById(windowId).classList.add('active');
      btnElement.classList.add('active');
    }
  </script>

</body>
</html>
